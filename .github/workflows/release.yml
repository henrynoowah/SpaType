# Push a tag like v0.1.3 (matching CFBundleShortVersionString) to build, sign and publish a release.
# Signing uses the self-signed "SpaType" certificate stored in the repo secrets, so every release keeps the
# same designated requirement: the in-app updater accepts it and Accessibility grants survive.
name: Release

on:
  push:
    tags: ['v*']
  # PRs and manual runs: same build and checks, uploaded as an artifact instead of published.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 26 SDK: needed for the FoundationModels (Apple Intelligence) code to be compiled in.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Info.plist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != Info.plist $VERSION"; exit 1; }

      - name: Import signing certificate
        env:
          P12: ${{ secrets.SPATYPE_CERT_P12 }}
          PASS: ${{ secrets.SPATYPE_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build
        env:
          SPATYPE_SIGN_IDENTITY: SpaType
        run: ./scripts/release.sh

      - name: Check FoundationModels is compiled in and weak-linked
        # Strongly linked, the app would crash at launch on macOS 13–25.
        run: |
          BIN=build/SpaType.app/Contents/MacOS/SpaType
          lipo "$BIN" -thin arm64 -output "$RUNNER_TEMP/arm64"   # Apple Intelligence code is arm64-only
          otool -l "$RUNNER_TEMP/arm64" | grep -B3 FoundationModels.framework | tee /dev/stderr | grep -q LC_LOAD_WEAK_DYLIB \
            || { echo "FoundationModels missing or not weak-linked" >&2; exit 1; }

      - name: Upload build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: SpaType-build
          path: build/SpaType-*.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/SpaType-$VERSION.zip" --title "SpaType $VERSION" --generate-notes
